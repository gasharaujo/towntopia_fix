plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = 'dev.gasharaujo'
version = '1.1.1'

base {
    archivesName = 'gashs-towntopia-fix-neoforge-1.21.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'
}

repositories {
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    if (providers.gradleProperty('townTopiaJar').isPresent()) {
        compileOnly files(providers.gradleProperty('townTopiaJar').get())
    } else {
        compileOnly 'curse.maven:towntopia-1750523:9324783'
    }
    if (providers.gradleProperty('refinedStorageJar').isPresent()) {
        compileOnly files(providers.gradleProperty('refinedStorageJar').get())
    } else {
        compileOnly 'curse.maven:refined-storage-243076:8211701'
    }
    if (providers.gradleProperty('appliedEnergisticsJar').isPresent()) {
        compileOnly files(providers.gradleProperty('appliedEnergisticsJar').get())
    } else {
        compileOnly 'curse.maven:applied-energistics-2-223794:9676922'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-proc:none')
}
